version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres_censo
    restart: always
    environment:
      POSTGRES_USER: censo
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: censo_escolar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: